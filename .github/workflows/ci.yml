name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint & Validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Validate JS syntax
        run: |
          for f in *.js; do
            node -c "$f" || echo "Syntax error in $f"
          done

  build-web:
    runs-on: ubuntu-latest
    name: Build Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Verify web build
        run: |
          echo "✅ Web assets ready"
          ls -la www/ | head -20
          ls -la index.html

  build-electron:
    runs-on: macos-latest
    name: Build macOS Electron
    if: github.ref == 'refs/heads/main'
    needs: [lint, build-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npx electron-builder --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: star-track-life-macos
          path: dist/mac/
