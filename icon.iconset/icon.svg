<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 背景 -->
  <rect width="512" height="512" rx="100" fill="#FAF8F5"/>

  <!-- 外边框 - 爱马仕橙 -->
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="#FF6B35" stroke-width="8"/>

  <!-- 内部装饰线 -->
  <rect x="40" y="40" width="432" height="432" rx="80" fill="none" stroke="#D4D2CF" stroke-width="2"/>

  <!-- W 字母 - 使用 Cormorant Garamond 风格 -->
  <text x="256" y="320"
        font-family="serif"
        font-size="200"
        font-weight="400"
        fill="#2C2C2C"
        text-anchor="middle">W</text>

  <!-- 底部装饰点 -->
  <circle cx="256" cy="400" r="6" fill="#FF6B35"/>
  <circle cx="226" cy="400" r="4" fill="#D4D2CF"/>
  <circle cx="286" cy="400" r="4" fill="#D4D2CF"/>
</svg>
